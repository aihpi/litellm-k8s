apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpt-oss-120b
  labels:
    app: gpt-oss-120b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpt-oss-120b
  template:
    metadata:
      labels:
        app: gpt-oss-120b
    spec:
      nodeSelector:
        accelerator: h100
      containers:
        - name: vllm
          # v0.27.1-cu129 — cu129 variant because the default tag needs a
          # CUDA 13 (r580+) host driver; cu129 runs on 12.9-era drivers too.
          image: vllm/vllm-openai@sha256:07913e94a58a4e61322c88f8d4647411b4dd394838b53abacaa32448d9d8de0a
          args:
            # openai/gpt-oss-120b, NOT amd/gpt-oss-120b-w-mxfp4-a-fp8: the AMD
            # checkpoint is quantized for AMD Instinct (native OCP-MX). On H100
            # quark falls back to emulation (dequantize-on-the-fly) and decode
            # drops to 4-7 tok/s vs ~115 tok/s on the native mxfp4 path. It
            # also needs `pip install amd-quark` which the stock image lacks.
            # Measured 2026-08-11 on gx13v2.
            - "--model"
            - "openai/gpt-oss-120b"
            - "--served-model-name"
            - "gpt-oss-120b"
            - "--config"
            - "/etc/vllm/GPT-OSS_Hopper.yaml"
            - "--tensor-parallel-size"
            - "1"
            - "--tool-call-parser"
            - "openai"
            - "--enable-auto-tool-choice"
            # Memory layout on one 80GiB H100 (measured 2026-08-11, v0.27.1):
            # weights 61.1GiB + CUDA graphs + activations, KV gets the rest.
            # Since v0.21 the profiler also reserves estimated CUDA graph
            # memory inside this budget, so 0.90 no longer left room for KV.
            # 0.95 + the two overrides below -> 11.7GiB KV = 330k tokens.
            - "--gpu-memory-utilization"
            - "0.95"
            # Model maximum (128K). Needs ~4.8GiB KV minimum for one request;
            # ~2.5x concurrency at full length, far more at RAG-typical sizes.
            - "--max-model-len"
            - "131072"
            # The config yaml asks for 4096 / graph capture to 2048, sized for
            # a bigger budget than this GPU has. max-num-seqs is 8, so graphs
            # beyond size 16 are unreachable anyway. CLI overrides the yaml.
            - "--max-num-batched-tokens"
            - "2048"
            - "--max-cudagraph-capture-size"
            - "16"
            - "--compilation-config"
            - '{"cudagraph_mode":"PIECEWISE"}'
            # KV cache CPU offload: GPU pool stays the hot tier for active
            # requests; this adds a 64GiB pinned-RAM tier for prefix-cache
            # history. 64GiB (not the recipe's 220GiB): pinning happens at
            # startup even with lazy_offload and costs ~3min at this size
            # (~13min at 160GiB); max in-flight KV is only 8 seqs x 131k
            # tokens. Drop the connector entirely if the "External prefix
            # cache hit rate" metric stays ~0% under real traffic.
            - "--kv-transfer-config"
            - '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use_per_rank":68719476736,"lazy_offload":true}}'
            # LoRA is disabled on gpt-oss-120b due to a confirmed MoE+LoRA bug
            # in the pinned vLLM digest (v0.20.0 NVIDIA Hopper-preview build,
            # sha256:04563c30...). Attempted re-enablement on 2026-05-28
            # (commit 1862f63, reverted in b377f30) crashed during warmup with:
            #   File ".../vllm/lora/layers/fused_moe.py", line 263, in reset_lora
            #     self.adapter_enabled[index] = 0
            #   torch.AcceleratorError: CUDA error: unspecified launch failure
            # i.e. out-of-bounds GPU array access in the fused MoE LoRA path.
            # Reducing max-loras/max-lora-rank or gpu-memory-utilization will
            # NOT help — it's a kernel-level bug, not OOM. The image is now
            # v0.27.1 (sha256:07913e94...), so re-trying may work. Re-enable by
            # uncommenting the args below, restoring the adapters volume/mount
            # + env var, and re-adding the gpt-oss-120b-adapters PVC in pvc.yaml.
            # - "--enable-lora"
            # - "--max-loras"
            # - "4"
            # - "--max-lora-rank"
            # - "64"
            # - "--lora-modules"
            # - "my-adapter=/adapters/my-adapter"
            - "--port"
            - "8000"
          ports:
            - containerPort: 8000
          # Without these, the pod reports Ready the moment the container
          # execs, while vLLM still needs minutes to load — LiteLLM then
          # routes into a dead backend (root cause of the 2026-08-07 silent
          # outage and most of the 2026-08-11 incident confusion).
          startupProbe:
            # Cold start measured at ~6min from warm cache; a fresh 61GiB
            # HF download adds ~10min. 120 x 15s = 30min ceiling.
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          env:
            - name: PYTORCH_ALLOC_CONF
              value: "expandable_segments:True"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: HF_TOKEN
            # Re-enable alongside the --enable-lora args above.
            # - name: VLLM_ALLOW_RUNTIME_LORA_UPDATING
            #   value: "true"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
            - name: vllm-config
              mountPath: /etc/vllm
            # - name: adapters
            #   mountPath: /adapters
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "256Gi"
              cpu: "64"
            requests:
              nvidia.com/gpu: "1"
              memory: "192Gi"
              cpu: "32"
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: gpt-oss-120b-cache
        - name: vllm-config
          configMap:
            name: gpt-oss-120b-config
        # - name: adapters
        #   persistentVolumeClaim:
        #     claimName: gpt-oss-120b-adapters
