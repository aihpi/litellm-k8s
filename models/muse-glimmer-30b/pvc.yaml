apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: muse-glimmer-30b-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-k8s-general
  resources:
    requests:
      # FP8 block checkpoint is 32.78 GiB; 50Gi leaves room for a second
      # revision in the HF cache without needing a resize.
      storage: 50Gi
