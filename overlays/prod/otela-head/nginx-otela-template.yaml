apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-otela-template
data:
  # Rendered by the official nginx image's entrypoint
  # (20-envsubst-on-templates.sh) from /etc/nginx/templates/ into
  # /etc/nginx/conf.d/otela-location.conf before nginx starts. The only
  # variable substituted is ${TUNNEL_TOKEN} — NGINX_ENVSUBST_FILTER on the
  # deployment pins it — so nginx's own $host/$http_upgrade/... are untouched.
  otela-location.conf.template: |
    location /otela-${TUNNEL_TOKEN}/ {
      proxy_pass http://litellm-service.litellm.svc.cluster.local:8085;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # One tunnel session is a single long-lived WebSocket; the 300s used for
      # LLM streaming would cut it mid-job.
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
      proxy_buffering     off;
      proxy_redirect      off;
    }
