apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: litellm

resources:
  - ../../base
  - ../../models
  - sealed-secrets/litellm-secret.yaml
  # OpenTela head node for Slurm-hosted workers. Prod-only (lives here, not in
  # base): staging has no models and no worker tunnel to point at it.
  - otela-head/deployment.yaml
  - otela-head/service.yaml
  - otela-head/nginx-otela-template.yaml
  # The tunnel passcode. nginx and the sidecar both reference this Secret and
  # will not start without it. Rotate by re-sealing (docs/opentela-slurm.md).
  - sealed-secrets/otela-tunnel.yaml
  # Nightly end-date policy for kisz-default keys (dry run until
  # KEY_EXPIRY_APPLY is "true"). Its image is pinned under `images:` below.
  - kisz-key-expiry/cronjob.yaml
  - sealed-secrets/kisz-key-expiry.yaml
  # KISENO agent runner: the A2A backend behind LiteLLM's /a2a/{agent}.
  # ClusterIP only, ingress limited to the LiteLLM pods. Its agent definitions
  # and RBAC live in namespace kiseno-agents and are a separate kustomize root
  # (kiseno-agents/), applied by scripts/deploy.sh.
  - kiseno-agent-runner/serviceaccount.yaml
  - kiseno-agent-runner/deployment.yaml
  - kiseno-agent-runner/service.yaml
  - kiseno-agent-runner/networkpolicy.yaml
  # Created with scripts/seal-kiseno-secrets.sh runner.
  - sealed-secrets/kiseno-agent-runner.yaml
  # Qwen-Bot, the Slack front end (Socket Mode, outbound only, no Service).
  - kiseno-slack-bot/serviceaccount.yaml
  - kiseno-slack-bot/deployment.yaml
  # Created with scripts/seal-kiseno-secrets.sh bot.
  - sealed-secrets/kiseno-slack-bot.yaml

patches:
  - path: patches/litellm-prod.yaml
  - path: patches/nginx-prod-service.yaml
  - path: patches/litellm-prod-authentik-sso.yaml
  # wstunnel sidecar + its Service port, for the OpenTela worker tunnel.
  - path: patches/litellm-otela-tunnel.yaml
  - path: patches/litellm-service-tunnel-port.yaml
  - path: patches/nginx-otela-tunnel.yaml
  # Pins prod's postgres-pvc to the PV it was rebound to out of band; staging
  # and dev bind elsewhere, so this cannot live in base.
  - path: patches/postgres-prod-pvc.yaml

replicas:
  - name: litellm-proxy
    count: 2
  # Parked to free GPUs (live cluster had these at 0 since 2026-08-20; every
  # `kubectl apply -k overlays/prod` was scaling them back to 1 and leaving the
  # pods Pending). To unpark: set count back to 1 and apply.
  - name: granite-4-h-tiny
    count: 0
  - name: qwen-3-5-9b
    count: 0
  - name: qwen-image-edit
    count: 0
  - name: qwen3-omni
    count: 0
  - name: qwen3-vl-32b
    count: 0

images:
  # KISENO agent runner, built from aihpi/tool-litellm@eca7cd8. Pinned by hand;
  # the pin bot only rewrites the tool-litellm entry at the end of this list.
  - name: ghcr.io/aihpi/tool-kiseno-agent-runner
    digest: sha256:db338e2b6b5d8c588956ce27dda91948282343e746d7e1b2bc07dce211423b87
  # Qwen-Bot, built from aihpi/tool-litellm@f00973b. Pinned by hand like the
  # runner.
  - name: ghcr.io/aihpi/tool-kiseno-slack-bot
    digest: sha256:c7a53822cd1d1d2ab7660a853b0303ee442c5814ba48ef6db7cf7aa3cffdbf41
  # Used in prod only by the kisz-key-expiry CronJob. Built from
  # aihpi/tool-litellm@bb97c3a (exempt teams, two-extension rule).
  # Pinned by hand; the pin bot only rewrites the tool-litellm entry below.
  - name: ghcr.io/aihpi/tool-kisz-auth-wrapper
    digest: sha256:a73248e471dc005d26a1a6a053038f0dfa9ca69eb4c8510f4dbb6cb129529500
  - name: ghcr.io/aihpi/tool-litellm
    digest: sha256:20aef62646900e065b7f785de051799c0f7034040d7ec0f6129072361a20f8e2
