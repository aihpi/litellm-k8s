# Namespace kiseno-agents and the read access of the KISENO agent runner and
# the Qwen-Bot Slack bot to the ConfigMaps in it.
#
# This is its own kustomize root, not part of overlays/prod: the prod overlay
# sets `namespace: litellm` on everything it builds, and these objects belong
# in the namespace kiseno-agents.
#
# How it reaches the cluster: the Argo CD Application `kiseno-agents` (project
# litellm-prod, this path at main, manual sync) owns it. The Application
# `litellm-prod-app` only tracks overlays/prod and does not build this folder.
# scripts/deploy.sh applies the same folder with `kubectl apply -k`, for a
# cluster without that Application.
#
# The agent and skill definitions themselves are not in this repository. They
# live in the private GitLab repository kisz/agent-skillbook, and the Argo CD
# Application `agent-skillbook` (../../../argocd/agent-skillbook.yaml) syncs
# them into this namespace as ConfigMaps.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
