# Agent definitions for the KISENO agent runner and the Qwen-Bot Slack bot.
#
# This is its own kustomize root, not part of overlays/prod: the prod overlay
# sets `namespace: litellm` on everything it builds, and these objects belong
# in the namespace kiseno-agents.
#
# How it reaches the cluster: the Argo CD Application `kiseno-agents` (project
# litellm-prod, this path at main, manual sync) owns it. The Application
# `litellm-prod-app` only tracks overlays/prod and does not build this folder.
# So a change here goes live by syncing `kiseno-agents` in Argo CD; the runner
# picks it up within its sync interval. scripts/deploy.sh applies the same
# folder with `kubectl apply -k`, for a cluster without that Application.
#
# agents-repo/ is an unchanged copy of
# kiseno-agent-runner/examples/agents-repo/ from aihpi/tool-litellm@a75cb12
# (branch aihpi-provider), without the _template folders, its README and its
# GitLab pipeline. It is a stand-in for the first test: the GitLab agents repo
# with its own Argo CD Application replaces it later. Remove agents-repo/ from
# `resources` then, or both will write the same ConfigMaps.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - agents-repo
