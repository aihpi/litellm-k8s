apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  LITELLM_LOG: debug
  UI_PATH: /ui
  config.yaml: |
    litellm_settings:
      default_internal_user_params:
        models: ["no-default-models"]
        teams: ["kisz-default"]

    general_settings:
      # Required for models added via UI / /model/new to survive restarts —
      # litellm 1.91.x does not read the STORE_MODEL_IN_DB env var.
      store_model_in_db: true

      # Staging runs a single replica, so the shared counters matter less here
      # than in prod — kept for parity so this gets exercised before prod, and
      # so /health/readiness reports show_no_redis_warning=false in both.
      # NOT litellm_settings.cache: that would also enable LLM response caching.
      coordination_redis:
        host: os.environ/REDIS_HOST
        port: os.environ/REDIS_PORT
        password: os.environ/REDIS_PASSWORD

      # Team assignment currently comes from litellm_settings.default_internal_user_params.teams,
      # not from SSO. To drive it from Authentik instead, get groups created, then set this to
      # "groups" and make each team_id match a group name exactly.
      # litellm_jwtauth:
      #   team_ids_jwt_field: "groups"

    model_list:
      - model_name: llama-3b
        litellm_params:
          model: openai/llama-3b
          api_base: http://llama-3b-service.litellm.svc.cluster.local:8000/v1
          api_key: dummy
      - model_name: qwen-image-edit
        litellm_params:
          model: aihpi-provider/qwen-image-edit
          api_base: http://qwen-image-edit.litellm.svc.cluster.local:8000/v1
          api_key: dummy
      - model_name: octen-embedding-8b
        litellm_params:
          model: openai/octen-embedding-8b
          api_base: http://octen-embedding-8b-service.litellm.svc.cluster.local:8000/v1
          api_key: dummy
          encoding_format: float
        model_info:
          metadata:
            mode: embedding
