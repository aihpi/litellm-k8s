apiVersion: apps/v1
kind: Deployment
metadata:
  name: lora-manager
  labels:
    app: lora-manager
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: a surge pod would run a SECOND
  # reconcile loop against the same ReadWriteMany adapters PVCs, and the
  # INFLIGHT/lock guards that keep reconciliation from colliding with an
  # in-progress upload or delete are process-local. Two pods can therefore
  # register the same adapter twice, or reconcile a half-copied directory that
  # the other pod is still writing (a multi-GB shutil.move takes tens of
  # seconds). Brief downtime on deploy is the right trade for a singleton.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lora-manager
  template:
    metadata:
      labels:
        app: lora-manager
    spec:
      containers:
        - name: lora-manager
          image: ghcr.io/aihpi/tool-lora-manager:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: LITELLM_MASTER_KEY
            - name: LITELLM_URL
              value: http://litellm-service:4000
            - name: ADAPTERS_BASE_PATH
              value: /adapters
            - name: ALLOWED_BASE_MODELS
              # Add new LoRA-enabled base models here AND mount their adapters PVC below.
              value: ministral-3-14b,gemma-4-31b,qwen-3-5-9b
            - name: MAX_UPLOAD_BYTES
              value: "4294967296"
            - name: MAX_LORA_RANK
              value: "64"
            # Refuse uploads/deletes whose caller can't be resolved from their
            # API key via /key/info — an unattributed adapter is one nobody can
            # delete later. The pass-through does NOT forward identity headers,
            # so the bearer token is the only signal; see README.
            - name: REQUIRE_IDENTITY
              value: "true"
            # Extra callers counting as ops (delete anything, POST /reconcile).
            # LITELLM_MASTER_KEY already qualifies, so these are only needed to
            # delegate ops to someone's personal key.
            - name: ADMIN_KEY_ALIASES
              value: ""
            - name: ADMIN_USER_IDS
              value: ""
            # Re-load adapters missing from vLLM and re-register ones missing
            # from LiteLLM's router every 5 min. 0 disables the loop but keeps
            # POST /reconcile.
            - name: RECONCILE_INTERVAL_SECONDS
              value: "300"
            - name: DEFAULT_ACCESS_GROUP
              value: "lora-uploaders"
          volumeMounts:
            - name: ministral-3-14b-adapters
              mountPath: /adapters/ministral-3-14b
            - name: gemma-4-31b-adapters
              mountPath: /adapters/gemma-4-31b
            - name: qwen-3-5-9b-adapters
              mountPath: /adapters/qwen-3-5-9b
          # Readiness fails (503) when LiteLLM rejects LITELLM_MASTER_KEY, so a
          # stale key shows up in `kubectl get pods` instead of only surfacing
          # as a failed upload. Liveness deliberately uses /livez: restarting
          # can't fix an unreachable LiteLLM, and a restart loop here would be
          # worse than a NotReady pod that still answers /health with the reason.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: ministral-3-14b-adapters
          persistentVolumeClaim:
            claimName: ministral-3-14b-adapters
        - name: gemma-4-31b-adapters
          persistentVolumeClaim:
            claimName: gemma-4-31b-adapters
        - name: qwen-3-5-9b-adapters
          persistentVolumeClaim:
            claimName: qwen-3-5-9b-adapters
