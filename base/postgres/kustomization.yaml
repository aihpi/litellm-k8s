apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Lets an overlay pull postgres on its own (overlays/dev does, to get the
# database without nginx/litellm/lora-manager). base/kustomization.yaml
# references these files directly and is unaffected.
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
