apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  LITELLM_LOG: info
  UI_PATH: /ui
  config.yaml: |
    litellm_settings:
      success_callback: ["prometheus"]
      require_auth_for_metrics_endpoint: false

      default_internal_user_params:
        models: ["no-default-models"]
        teams: ["kisz-default"]

      key_generation_settings:
        personal_key_generation:
          allowed_user_roles: ["proxy_admin"]

      # Disable per-user budget tracking in Prometheus — avoids a Postgres query
      # on every /metrics scrape, which was blocking the event loop for 5-23s.
      enable_end_user_cost_tracking_prometheus_only: false

      # Strip high-cardinality labels (hashed_api_key, user UUID, model_id UUID,
      # client_ip, user_agent, user_email) from all exported metrics. Without this,
      # each unique user×key×model combination creates new histogram bucket series,
      # causing the /metrics payload to grow unboundedly until the pod is restarted.
      # The list format (group/metrics/include_labels) is required by LiteLLM's
      # PrometheusMetricsConfig schema — a flat dict causes a startup crash.
      prometheus_metrics_config:
        - group: latency_histograms
          metrics:
            - litellm_request_total_latency_metric
            - litellm_llm_api_latency_metric
            - litellm_llm_api_time_to_first_token_metric
            - litellm_request_queue_time_seconds
          include_labels:
            - model
            - requested_model
            - api_key_alias
            - team_alias
        - group: overhead_latency
          metrics:
            - litellm_overhead_latency_metric
          include_labels:
            - litellm_model_name
            - api_key_alias
        - group: deployment_latency
          metrics:
            - litellm_deployment_latency_per_output_token
          include_labels:
            - litellm_model_name
            - api_key_alias
            - team_alias
        - group: token_spend_metrics
          metrics:
            - litellm_input_tokens_metric
            - litellm_output_tokens_metric
            - litellm_total_tokens_metric
            - litellm_spend_metric
            - litellm_requests_metric
          include_labels:
            - model
            - api_key_alias
            - team_alias
        - group: request_counters
          metrics:
            - litellm_proxy_total_requests_metric
          include_labels:
            - requested_model
            - api_key_alias
            - team_alias
            - status_code
        - group: deployment_counters
          metrics:
            - litellm_deployment_total_requests
            - litellm_deployment_success_responses
          include_labels:
            - requested_model
            - litellm_model_name
            - api_key_alias
            - team_alias

    general_settings:
      # Persist models registered via the UI / POST /model/new in Postgres and
      # load them back on startup. The STORE_MODEL_IN_DB env var is NOT read by
      # litellm 1.91.x — only this config key enables the feature. Without it,
      # UI-added models disappear from the router on every pod restart (the DB
      # rows survive; they just never get loaded).
      store_model_in_db: true

      # Shared counters across the 2 prod replicas: rate limits, team/key spend
      # before it flushes to Postgres, single-runner election for the
      # housekeeping jobs, and one health-check per deployment instead of one
      # per pod. Also what clears the "No Redis configured" banner in the UI.
      #
      # This block is deliberately NOT the litellm_settings.cache snippet from
      # the "What Needs Redis" docs page. That one also switches on LLM response
      # caching, so identical prompts start being served stored answers instead
      # of hitting the model — a user-visible behaviour change. coordination_redis
      # gives the shared counters without touching response caching.
      #
      # REDIS_HOST/REDIS_PORT/REDIS_PASSWORD in the deployment do nothing on
      # their own: the bare REDIS_* fallback is only read inside the cache init
      # path, so this block is what actually wires them up.
      coordination_redis:
        host: os.environ/REDIS_HOST
        port: os.environ/REDIS_PORT
        password: os.environ/REDIS_PASSWORD

      # Routes the user-facing /v1/lora/* paths to the internal lora-manager
      # service. `auth: true` gates on the caller's LiteLLM API key (rather
      # than master-only). `forward_headers: true` makes LiteLLM pass user
      # identity headers (x-litellm-user-id, x-litellm-key-alias) downstream
      # so lora-manager can attribute uploads.
      pass_through_endpoints:
        - path: "/v1/lora/upload"
          target: "http://lora-manager:8000/upload"
          auth: true
          forward_headers: true
        - path: "/v1/lora/adapters"
          target: "http://lora-manager:8000/adapters"
          auth: true
          forward_headers: true
        # Fixed path with name/base_model as form fields rather than
        # DELETE /v1/lora/adapters/{base_model}/{name}: pass_through_endpoints
        # matches exact paths. lora-manager only lets the uploader (or an ops
        # key alias) through, which is why forward_headers matters here.
        - path: "/v1/lora/delete"
          target: "http://lora-manager:8000/delete"
          auth: true
          forward_headers: true

      # Team assignment currently comes from litellm_settings.default_internal_user_params.teams,
      # not from SSO. To drive it from Authentik instead, get groups created, then set this to
      # "groups" and make each team_id match a group name exactly.
      # litellm_jwtauth:
      #   team_ids_jwt_field: "groups"

    # Per-token costs (USD/token) let LiteLLM populate `spend` on every
    # LiteLLM_SpendLogs row, which is what demand//cost modelling reads. They are
    # reference market rates for the equivalent hosted model, NOT our GPU cost —
    # see docs/model-pricing.md for each figure's source and how to refresh it.
    #
    # Two placement rules, both load-bearing:
    #   1. Costs go in litellm_params, not model_info. POST /model/update (used to
    #      backfill DB-registered models) persists litellm_params only. The router
    #      copies these fields into the model cost map at load, so both work here —
    #      keeping one placement keeps config.yaml and the DB catalog comparable.
    #   2. Always write a decimal point: PyYAML (YAML 1.1) parses `5e-8` as a
    #      *string* and only `5.0e-8` as a float.
    model_list:
      - model_name: llama-3b
        litellm_params:
          model: openai/llama-3b
          api_base: http://llama-3b-service:8000/v1
          api_key: dummy
          input_cost_per_token: 5.0e-8    # $0.05 / 1M
          output_cost_per_token: 3.3e-7   # $0.33 / 1M
      - model_name: qwen-image-edit
        litellm_params:
          model: aihpi-provider/qwen-image-edit
          api_base: http://qwen-image-edit:8000/v1
          api_key: dummy
          # Image models bill per image, not per token: LiteLLM computes
          # input_cost_per_image * n. $0.04 is the market average across
          # mainstream image gen/edit APIs. Preferred over input_cost_per_pixel
          # because it needs no height/width from the aihpi-provider response.
          input_cost_per_image: 0.04
      - model_name: octen-embedding-8b
        litellm_params:
          model: openai/octen-embedding-8b
          api_base: http://octen-embedding-8b-service:8000/v1
          api_key: dummy
          encoding_format: float
          input_cost_per_token: 4.0e-8    # $0.04 / 1M
          output_cost_per_token: 0.0      # embeddings return no output tokens
        model_info:
          metadata:
            mode: embedding
      - model_name: gemma-4-31b
        litellm_params:
          model: openai/gemma-4-31b
          api_base: http://gemma-4-31b-service:8000/v1
          api_key: dummy
          input_cost_per_token: 1.4e-7    # $0.14 / 1M
          output_cost_per_token: 4.0e-7   # $0.40 / 1M
      - model_name: qwen-3-5-9b
        litellm_params:
          model: openai/qwen-3-5-9b
          api_base: http://qwen-3-5-9b-service:8000/v1
          api_key: dummy
          # Qwen3.5 enables thinking by default; turn it off proxy-wide.
          # Callers can re-enable per request by overriding chat_template_kwargs.
          extra_body:
            chat_template_kwargs:
              enable_thinking: false
          input_cost_per_token: 1.0e-7    # $0.10 / 1M
          output_cost_per_token: 1.5e-7   # $0.15 / 1M
      - model_name: gpt-oss-120b
        litellm_params:
          model: openai/gpt-oss-120b
          api_base: http://gpt-oss-120b-service:8000/v1
          api_key: dummy
          # Drop request params the vLLM backend does not accept instead of
          # returning 400. Clients aimed at hosted reasoning models send
          # params gpt-oss/vLLM has no equivalent for (e.g. reasoning_effort),
          # which would otherwise fail the whole request.
          drop_params: true
          input_cost_per_token: 1.4e-7    # $0.14 / 1M
          output_cost_per_token: 6.0e-7   # $0.60 / 1M
      - model_name: llama-3-3-70b
        litellm_params:
          model: openai/llama-3-3-70b
          api_base: http://llama-3-3-70b-service:8000/v1
          api_key: dummy
          input_cost_per_token: 2.93e-7   # $0.293 / 1M
          output_cost_per_token: 7.2e-7   # $0.72 / 1M
      # Example: registering a LoRA adapter served by vLLM as a separate model entry.
      # The served-model-name must match what vLLM exposes (preloaded via
      # --lora-modules NAME=path, or runtime-loaded via /v1/load_lora_adapter).
      # - model_name: ministral-3-14b-my-adapter
      #   litellm_params:
      #     model: openai/ministral-3-14b-my-adapter
      #     api_base: http://ministral-3-14b-service:8000/v1
      #     api_key: dummy
