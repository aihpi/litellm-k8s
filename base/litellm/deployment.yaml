apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  labels:
    app: litellm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      annotations:
        rollout/restart: "2026-08-13T10:26:01Z"
      labels:
        app: litellm
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - vx01
                      - vx02
                      - vx03
                      - vx04
      containers:
        - name: litellm
          # To rollback: replace the tag with the pinned digest below.
          # known-good: ghcr.io/aihpi/tool-litellm@sha256:39644e531d898e92f334618702e62837b05ac03e8531c26a055eb54a612e81af
          image: ghcr.io/aihpi/tool-litellm:aihpi-provider
          imagePullPolicy: Always
          command: ["litellm"]
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000", "--num_workers", "1"]
          ports:
            - containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: LITELLM_MASTER_KEY
            - name: LITELLM_CONFIG
              value: /etc/litellm/config.yaml
            # NOTE: litellm 1.91.x ignores this env var — the flag that actually
            # enables DB-backed models is general_settings.store_model_in_db in
            # config.yaml (see configmap.yaml). Kept for forward-compat.
            - name: STORE_MODEL_IN_DB
              value: "True"
            # Encrypts model credentials stored in the DB. LiteLLM falls back to
            # LITELLM_MASTER_KEY when this is unset, which silently orphans every
            # DB-stored model if the master key is ever rotated. Set once, never
            # change it. `optional` keeps pods starting with secrets sealed before
            # this key existed (the master-key fallback applies until then).
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: LITELLM_SALT_KEY
                  optional: true
            - name: LITELLM_LOG
              valueFrom:
                configMapKeyRef:
                  name: litellm-config
                  key: LITELLM_LOG
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: POSTGRES_PASSWORD
            # DATABASE_URL is assembled from POSTGRES_PASSWORD via K8s $(VAR)
            # interpolation so only the password lives in the secret; host/db/user
            # are in plain manifest and point at the in-cluster postgres-service.
            - name: DATABASE_URL
              value: postgresql://litellm:$(POSTGRES_PASSWORD)@postgres-service:5432/litellm
            - name: LITELLM_DATABASE_URL
              value: postgresql://litellm:$(POSTGRES_PASSWORD)@postgres-service:5432/litellm
            - name: UI_PATH
              valueFrom:
                configMapKeyRef:
                  name: litellm-config
                  key: UI_PATH
            - name: UI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: UI_USERNAME
            - name: UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: UI_PASSWORD
            # Let LiteLLM apply DB schema changes on startup using versioned
            # Prisma migrations (`prisma migrate deploy`) rather than `db push`.
            - name: DISABLE_SCHEMA_UPDATE
              value: "false"
            - name: USE_PRISMA_MIGRATE
              value: "True"
            - name: DOCS_URL
              value: "/docs"
            - name: ROOT_REDIRECT_URL
              value: "/ui"
          volumeMounts:
            - name: litellm-config
              mountPath: /etc/litellm/config.yaml
              subPath: config.yaml
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config
